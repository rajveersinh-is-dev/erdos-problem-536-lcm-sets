[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "erdos_problem_536_lcm_sets"
version = "1.0.0"
description = "Investigation of Erdős Problem #536: Sets with no three distinct elements having equal pairwise LCMs"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "rajveersinh-is-dev"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/rajveersinh-is-dev/erdos-problem-536-lcm-sets"

[tool.setuptools]
py-modules = ['']
